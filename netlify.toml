[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Required in Netlify UI → Project configuration → Environment variables:
#   NEXT_PUBLIC_SITE_URL           = https://dpdpconsultancy.in              (scope: Builds)
#   NEXT_PUBLIC_CONSENT_API_URL    = https://your-consent-api.example.com  (scope: Builds)
#   CONSENT_API_URL                = same value                             (scope: Builds + Functions)
#   NEXT_PUBLIC_CONSENT_DOMAIN     = dpdpconsultancy.in                     (scope: Builds)
#   NEXT_PUBLIC_GA_MEASUREMENT_ID  = G-S52KHLM8Q0                           (scope: Builds)
# Re-deploy after changing env vars — NEXT_PUBLIC_* values are baked in at build time.
